name: Native portable Windows
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked build tools
        run: npm ci
      - name: Validate tag and source safety
        run: |
          python -c "import os,tomllib; v=tomllib.load(open('native-dock/Cargo.toml','rb'))['package']['version']; tag=os.environ.get('GITHUB_REF_NAME',''); assert not os.environ.get('GITHUB_REF','').startswith('refs/tags/') or tag=='v'+v"
          node scripts/check-safe.mjs
          node --test --test-isolation=none scripts/test-check-safe.mjs scripts/test-native-music.mjs
          python -m unittest test_startup_windows
      - name: Native regression tests
        run: cargo test --locked --manifest-path native-dock/Cargo.toml -- --test-threads=1
      - name: Build and inspect portable ZIP
        run: |
          python scripts/build-portable.py
          python -c "import pathlib,subprocess,sys; p=next(pathlib.Path('share').glob('Lumen-*-windows-x86_64')); subprocess.check_call([sys.executable,'scripts/verify-portable.py',str(p)])"
          python -c "import pathlib,subprocess,sys; p=next(pathlib.Path('share').glob('Lumen-*-windows-x86_64.zip')); subprocess.check_call([sys.executable,'scripts/test-portable.py',str(p)])"
          python scripts/export-source.py --destination .scratch/source-export
      - uses: actions/upload-artifact@v4
        with:
          name: Lumen-windows-x86_64
          path: |
            share/*.zip
            share/*.sha256
      - name: Publish native portable and source archives
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" share/*.zip share/*.sha256 --verify-tag --title "Lumen $GITHUB_REF_NAME" --notes-file docs/release-notes.md

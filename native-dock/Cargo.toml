[package]
name = "lumen"
version = "0.1.2"
edition = "2021"
license = "MIT"
authors = ["Nhat Ng"]
publish = false

[build-dependencies]
serde_json = "1"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "ico"] }
resvg = { version = "0.45", default-features = false }
sha2 = "0.10"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
windows-sys = { version = "0.59", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Devices_Display", "Win32_Networking_WinHttp",
  "Win32_System_Time", "Win32_System_SystemInformation", "Win32_System_LibraryLoader", "Win32_System_Threading",
  "Win32_System_DataExchange", "Win32_System_Memory",
  "Win32_Security", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Controls",
  "Win32_System_Registry", "Win32_System_ApplicationInstallationAndServicing",
  "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi",
] }

[profile.dev]
opt-level = 3
debug = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

